name: Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - "src/**"
      - "build.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web UI
        run: ./build.sh

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk next-step.apk

      - uses: actions/upload-artifact@v4
        with:
          name: next-step-apk
          path: next-step.apk

      - name: Publish to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest next-step.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Next Step for Android (latest build)" \
            --notes "Built from ${{ github.ref_name }} at ${{ github.sha }}. Download next-step.apk on your phone and open it to install."
